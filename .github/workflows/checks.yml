name: Quality checks

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fpl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fpl -d fpl_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FPL_TEST_DATABASE_URL: postgresql://fpl:test-only@localhost:5432/fpl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
